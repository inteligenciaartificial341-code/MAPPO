# Rede anti-regressao do MAPPO.
#
# Roda as mesmas suites que `npm test` roda na maquina do proprietario, a cada push
# em main, a cada pull request, e a mao pelo botao "Run workflow". Se uma suite
# falhar, o commit fica marcado com o X vermelho.
#
# Custo: zero. Usa apenas runners publicos do GitHub Actions (ubuntu-latest), que sao
# gratuitos para repositorios publicos. Nao ha runner privado, servico externo nem
# passo pago aqui -- e isso e restricao dura do projeto.
#
# O que este CI NAO faz, de proposito:
#   - nao publica, nao faz deploy, nao toca em producao;
#   - nao executa diag-difer, diag-linkreal e diag-pubreal, que batem no site publicado
#     (github.io) e no Firestore real. Esses tres dependem de rede, de producao e do
#     estado da conta do proprietario, e rodam so a mao (`npm run test:producao`).
#     O runner ja os deixa de fora por padrao -- este CI nao passa nenhuma flag que os
#     inclua, entao a exclusao vale em duas camadas.
#   - nao toca no Firestore de producao para testar as regras. A suite testes/teste-regras.js
#     sobe o Firestore Emulator local no projeto "demo-mappo-regras": o prefixo "demo-" e a
#     garantia do proprio Firebase de que nem o SDK nem o emulador falam com um projeto real.
#     Nao ha credencial, secret nem `firebase login` em nenhum passo deste workflow.
#
# O que ele NAO garante: o job roda DEPOIS do commit ja estar em main, e o GitHub Pages
# publica de main sem consultar este resultado. Para o vermelho de fato impedir a
# publicacao e preciso ligar protecao de ramo em main exigindo o status check
# "Suites anti-regressao" -- configuracao que so o proprietario pode fazer.

name: testes

on:
  # push so em main: um PR de ramo do mesmo repositorio dispararia push E pull_request
  # para o mesmo commit, rodando tudo duas vezes e gastando o dobro de minutos
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    name: Suites anti-regressao
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # O Firestore Emulator (testes/teste-regras.js) roda em Java. O ubuntu-latest ja
      # traz um JDK, mas nao ha promessa de qual versao -- fixar aqui e o que faz o CI
      # subir o mesmo emulador que a maquina do proprietario (Java 21).
      - name: Instalar o Java (o Firestore Emulator roda nele)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ANTES do npm ci, de proposito: e o script de pos-instalacao do pacote
      # "playwright" que baixa o navegador. Restaurar o cache depois do npm ci nao
      # economizaria nada -- o download ja teria acontecido.
      # A chave inclui o package-lock, que fixa a versao do Playwright e portanto a do
      # navegador: trocar de versao invalida o cache sozinho.
      - name: Reaproveitar o Chromium baixado
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar as dependencias
        # escopo de passo, nao do job: impede o pos-instalacao de baixar navegador,
        # sem afetar o passo seguinte, que e quem deve baixar (e o faz de forma
        # idempotente, sem rebaixar o que o cache ja trouxe)
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      # Idempotente: com o cache quente, so instala as bibliotecas de sistema (que nao
      # ficam no cache); com o cache frio, baixa o navegador tambem.
      - name: Instalar o Chromium e as bibliotecas do sistema
        run: npx playwright install --with-deps chromium

      # A chave inclui o package-lock, que fixa a versao do firebase-tools e portanto a
      # do .jar do emulador: trocar de versao invalida o cache sozinho.
      - name: Reaproveitar o emulador baixado
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emuladores-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Passo separado de proposito: a suite de regras subiria o emulador sozinha (e
      # baixaria o .jar na primeira vez), mas ai um download lento apareceria como
      # "a suite de regras estourou o tempo" em vez de "o download demorou".
      - name: Baixar o Firestore Emulator
        run: npm run emulador:baixar

      # `npm test` == `node testes/executar.js`: em serie, com timeout por suite, e
      # ja sem os tres que batem em producao. Sai com codigo 1 se alguma suite falhar.
      - name: Rodar as suites
        run: npm test

      # Diante do X vermelho, 15 linhas de texto no log nao bastam: as suites geram
      # capturas de tela e PDFs que morreriam com o runner.
      - name: Guardar as capturas e PDFs da falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: artefatos-da-falha
          if-no-files-found: ignore
          retention-days: 7
          path: |
            diag-concluir.png
            linkreal.png
            etiq-*.png
            mob-*.png
            testes/*.pdf
            firestore-debug.log
            firebase-debug.log
